<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookFace - Real Faces, Real Connections</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e7f3ff;font-family:Arial,Helvetica,sans-serif;padding-bottom:80px}
.header{background:#1877F2;color:#fff;padding:10px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.header img{width:40px;height:40px;border-radius:8px;background:#fff}
.logo{font-size:28px;font-weight:900}
.card{background:#fff;border-radius:10px;margin:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card img.real,.card video.real{width:100%;aspect-ratio:9/16;height:auto;max-height:85vh;object-fit:cover;object-position:top center;border-radius:12px;background:#000;display:block}
.tabs{display:flex;gap:10px;padding:10px 15px}
.tab{background:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid #ddd}
.tab.active{background:#1877F2;color:#fff}
.post-box{background:#fff;margin:12px;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center}
.post-box input{flex:1;border:none;background:#f0f2f5;padding:10px 14px;border-radius:20px;outline:none}
.post-box button{background:#1877F2;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.actions{display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee;margin-top:10px}
.actions span{cursor:pointer;padding:6px 12px;border-radius:6px;font-size:14px}
.bottom-nav{background:#fff;border-radius:20px;margin:15px;padding:10px;display:flex;justify-content:space-around;position:fixed;bottom:10px;left:10px;right:10px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.waitlist{background:#fff;margin:15px;border-radius:12px;padding:16px}
.waitlist input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.waitlist button{width:100%;background:#1877F2;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700}
#shareModal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:999;align-items:flex-end}
#shareModal.show{display:flex}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px;animation:up.3s}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 12px}
.share-row{display:flex;gap:12px;overflow-x:auto;padding:8px 0}
.share-opt{text-align:center;min-width:70px;cursor:pointer}
.share-opt div{width:56px;height:56px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 6px}
.share-opt.whatsapp div{background:#25D366;color:#fff}
.share-opt b{font-size:11px;display:block}
#imgPreview{margin:0 12px;display:none}
#imgPreview img, #imgPreview video{width:100%;aspect-ratio:9/16;height:auto;object-fit:cover;object-position:top center;border-radius:12px}
</style>
</head>
<body>
<div class="header"><img src="logo.png" alt="BF"><div class="logo">bookface</div><div style="margin-left:auto;font-size:11px">Kelvin Onoja</div></div>
<div class="tabs"><span class="tab active" id="t1">For You</span><span class="tab" id="t2">Following</span><span class="tab" id="t3">Groups</span></div>
<div class="post-box"><img src="logo.png" style="width:36px;height:36px;border-radius:50%"><input id="postInput" placeholder="What's on your mind, Kelvin?"><input type="file" id="imgInput" accept="image/*,video/*" style="display:none" onchange="previewMedia()"><button onclick="document.getElementById('imgInput').click()" style="background:#e4e6eb;color:#333">📷🎥</button><button onclick="addPost()">Post</button></div>
<div id="imgPreview"><img id="prev" style="display:none"><video id="prevV" style="display:none" controls></video><button onclick="clearMedia()" style="background:red;color:#fff;border:none;padding:6px 12px;border-radius:6px;margin-top:6px">X Remove</button></div>
<div id="feed"></div>
<div id="shareModal" onclick="if(event.target.id=='shareModal') this.classList.remove('show')"><div class="sheet"><div class="handle"></div><div style="display:flex;gap:10px;align-items:center"><img src="logo.png" style="width:36px;height:36px;border-radius:50%"><div><b>Kelvin Onoja</b></div></div><div id="shareText" style="padding:12px 0">Say something...</div><div style="text-align:right"><button onclick="doShareNow()" style="background:#1877F2;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:700">Share now</button></div><div class="share-row"><div class="share-opt" onclick="shareTo('story')"><div>➕</div><b>Your story</b></div><div class="share-opt whatsapp" onclick="shareTo('whatsapp')"><div>W</div><b>WhatsApp</b></div><div class="share-opt" onclick="shareTo('copy')"><div>🔗</div><b>Copy link</b></div></div></div></div>
<div class="waitlist"><h3>Join Waitlist</h3><form action="https://formsubmit.co/bookfacedating@gmail.com" method="POST"><input type="hidden" name="_next" value="https://niyyahbook101.github.io/bookface/thankyou.html"><input type="hidden" name="_captcha" value="false"><input name="name" placeholder="Your Name" required><input name="email" type="email" placeholder="Your Email" required><button type="submit">Join Waitlist</button></form></div>
<div class="bottom-nav"><span>🏠 Home</span><span>🔍 Search</span><span>➕ Post</span><span>💬 Chat</span><span>👤 You</span></div>
<script>
let posts = JSON.parse(localStorage.getItem('bf_posts') || '[]');
let defaults = [
{name:'Amira Johnson', time:'2h ago', text:'Just launched my new art studio in Lagos! 🎨', img:'https://picsum.photos/seed/amira/600/800', type:'image', likes:124, comments:[]},
];
if(posts.length==0) posts=defaults;
let currentShareIndex=0; let selectedMedia=''; let selectedType='image';
function previewMedia(){
 let f=document.getElementById('imgInput').files[0]; if(!f) return;
 selectedType = f.type.startsWith('video')? 'video' : 'image';
 let r=new FileReader(); r.onload=e=>{
  selectedMedia=e.target.result;
  if(selectedType=='video'){ document.getElementById('prev').style.display='none'; let v=document.getElementById('prevV'); v.src=selectedMedia; v.style.display='block'; }
  else { document.getElementById('prevV').style.display='none'; let im=document.getElementById('prev'); im.src=selectedMedia; im.style.display='block'; }
  document.getElementById('imgPreview').style.display='block';
 }; r.readAsDataURL(f);
}
function clearMedia(){selectedMedia=''; document.getElementById('imgPreview').style.display='none'; document.getElementById('prev').style.display='none'; document.getElementById('prevV').style.display='none'; document.getElementById('imgInput').value='';}
function render(){
 let h=''; posts.forEach((p,i)=>{
  let commentsHtml=''; if(p.comments){p.comments.forEach(cm=>{commentsHtml+=`<div style="background:#f0f2f5;border-radius:12px;padding:8px 10px;margin:6px 0 0 0;font-size:13px"><b>${cm.name}:</b> ${cm.text}</div>`;});}
  let mediaHtml=''; if(p.img){ if(p.type=='video') mediaHtml=`<video class="real" src="${p.img}" controls playsinline></video>`; else mediaHtml=`<img class="real" src="${p.img}">`; }
  h+=`<div class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><img src="logo.png" style="width:36px;height:36px;border-radius:50%"><div><b>${p.name}</b><div style="font-size:11px;color:#777">${p.time}</div></div></div><p style="margin-bottom:10px">${p.text}</p>${mediaHtml}${commentsHtml}<div class="actions"><span onclick="like(${i})">👍 Like (${p.likes})</span><span onclick="comment(${i})">💬 Comment (${p.comments?p.comments.length:0})</span><span onclick="openShare(${i})">↗️ Share</span></div></div>`;
 }); document.getElementById('feed').innerHTML=h; localStorage.setItem('bf_posts',JSON.stringify(posts));
}
function addPost(){let t=document.getElementById('postInput').value.trim(); if(!t &&!selectedMedia) return; posts.unshift({name:'Kelvin Onoja', time:'Just now', text:t||(selectedType=='video'?'🎥 Video':'📷 Photo'), img:selectedMedia, type:selectedType, likes:0, comments:[]}); document.getElementById('postInput').value=''; clearMedia(); render();}
function like(i){posts[i].likes++; render();}
function comment(i){let c=prompt('Write a comment:'); if(!c) return; if(!posts[i].comments) posts[i].comments=[]; posts[i].comments.push({name:'Kelvin Onoja', text:c}); render();}
function openShare(i){currentShareIndex=i; document.getElementById('shareText').innerText=posts[i].text; document.getElementById('shareModal').classList.add('show');}
function doShareNow(){posts.unshift({name:'Kelvin Onoja', time:'Just now', text:'Shared: '+posts[currentShareIndex].text, img:posts[currentShareIndex].img||'', type:posts[currentShareIndex].type||'image', likes:0, comments:[]}); document.getElementById('shareModal').classList.remove('show'); render();}
function shareTo(type){let text=posts[currentShareIndex].text; let url=location.href; if(type=='whatsapp') window.open('https://wa.me/?text='+encodeURIComponent(text+' '+url),'_blank'); else if(type=='copy'){navigator.clipboard.writeText(url); alert('Link copied!');} else {doShareNow();}}
render();
</script>
</body>
</html>
